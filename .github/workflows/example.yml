name: swarm-review-example

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  # Add `checks: write` here only if you pass `check-run-id` to the action.
  # It is intentionally omitted so the default workflow follows least privilege
  # (see Scorecard Token-Permissions).

jobs:
  review:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      contains(github.event.comment.body, '/swarm-review') &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    concurrency:
      group: swarm-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # Trust model: on pull_request this checks out the PR merge commit, which
      # is attacker-controlled on forks. The action defends in depth: the diff
      # always comes from the GitHub API, static-analysis shell commands are
      # skipped on fork PRs unless static_analysis.allow_forks is set, and all
      # posted text is secret-redacted. For public repos also consider consuming
      # a pinned release (EvanGribar/Swarm-Review@v1) instead of building ./
      # so PR-head package.json scripts never run beside your secrets.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build action bundle
        run: |
          npm ci
          npm run build

      - name: Skip swarm-review when API key is missing
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "Skipping swarm-review-example because ANTHROPIC_API_KEY is not configured."

      - name: Run swarm-review
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: ./
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ env.ANTHROPIC_API_KEY }}
          anthropic-model: claude-3-5-sonnet-latest
          config-path: .swarm.yml
